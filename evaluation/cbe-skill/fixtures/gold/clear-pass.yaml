id: gold.lang.mirror-pass
label: clear-pass
expected: pass
note: The lecturer wrote German, the reply is German throughout.
rubric: >-
  The assistant replies in the same language the lecturer used in their message.
user: Wie formuliere ich eine Kompetenz, die man auch pruefen kann?
answer: >-
  Beginnen Sie bei der Situation, nicht beim Verb. Eine pruefbare Kompetenz nennt,
  was eine Studentin in welcher Situation mit welchen Mitteln zustande bringt — dann
  ergibt sich die Pruefform fast von selbst. In welcher konkreten Situation soll Ihre
  Studentin das koennen?

