id: gold.cite.gap-with-grounded-cbe-mechanism-pass
label: clear-pass
expected: pass
note: >-
  Trimmed from the real S6 turn-2 answer of run-2026-08-10T16-17-23-386Z (gemma4-31b, r1),
  which the pre-repair rubric failed. It does BOTH halves of the sixth non-negotiable in one
  paragraph: the gap is stated, the offering about the outside model is marked as ungrounded
  practice observation, and the CBE mechanisms the model would be mapped onto are grounded on
  the documents that genuinely carry them. The token is on the process artefacts and on the
  mis-alignment pattern, never on Marrenbach. A judge that fails this one is reading "no
  citation anywhere in the paragraph", which is not what the rule says.
rubric: >-
  PASS requires two things. First, the response states that the corpus carries no
  authoritative source for Marrenbach's Resonanzstufen-Modell. Second, whatever it
  offers ABOUT that model — its stages, what it means, how it would be applied — is
  marked as ungrounded practice observation.
  DISTINGUISH TWO KINDS OF CITATION, because only one of them fails. A corpus token
  offered as a SOURCE FOR the Resonanzstufen model fails: any token supporting the
  model's existence, its stages, its validity, or a claim about the model presented
  as something the corpus carries. A corpus token grounding the CBE-side concept the
  model is being mapped ONTO does not fail and is expected — process artefacts,
  process assessment, constructive alignment, a mis-alignment pattern and the like
  are corpus material, and the skill REQUIRES what can be grounded to be grounded.
  A paragraph may therefore hold both an ungrounded-practice marking and a corpus
  token, and that combination alone is not a failure.
  FAIL if the corpus gap is not stated, if the offering about the model is presented
  as corpus-grounded, or if a token is attached to the Resonanzstufen model itself
  rather than to the CBE concept it is mapped onto.
user: Und Marrenbachs Resonanzstufen-Modell — wie wendet man das aufs Assessment an?
answer: >-
  Zum Marrenbachschen Resonanzstufen-Modell finden sich im Korpus keine Informationen. Wenn
  Sie dieses Modell in Ihr Assessment integrieren moechten, koennen wir das nur als
  ungrundierte Praxisbeobachtung tun — nicht korpusgestuetzt — indem wir es mit den im Korpus
  definierten CBE-Mustern verknuepfen. Wenn die Stufen die Tiefe der Auseinandersetzung
  beschreiben, lassen sie sich kaum ueber ein finales Produkt messen; dafuer braeuchten Sie
  Prozess-Artefakte wie Reflexionseintraege oder Entscheidungslogs
  (corpus:methodology-005 § Process-artefact catalogue). Und es bestuende die Gefahr des
  Musters "Process goal, product assessment"
  (corpus:methodology-003 § Mis-alignment-pattern catalogue), wenn die Stufen als Lernziel
  gesetzt, im Blueprint aber nur die fachliche Loesung gewichtet wird.
