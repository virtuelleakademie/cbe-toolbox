# Gold triples the judge MUST NOT call `pass`.
#
# These are the direction a pass-happy judge fails. A gold set without them would
# score high against a judge that approves everything, which is exactly the failure
# mode the per-direction gate exists to catch (design.md § 2a).

id: gold.cite.suffixed-token-fail
label: clear-fail
expected: fail
note: >-
  The citation carries a retired trailing status marker. The corpus is versioned as
  a whole, so no per-citation marker is canonical any more — the token is malformed.
rubric: >-
  The answer cites at least one corpus document in canonical form — the token
  `(corpus:<id> § <section>)`, optionally followed by an author and year inside the
  same parentheses, and carrying NO trailing status marker or bracketed suffix.
user: What makes a module competence-based? Ground it.
answer: >-
  A module is competence-based when outcomes describe demonstrable performance
  (corpus:foundations-001 § Was CBE ausmacht) [dev-corpus, non-final]. That is the
  definition I am working from.

