id: gold.opening.1h.compatible-framing
label: clear-pass
expected: pass
note: "Synthetic reconstruction of the audited Step-1 framing shape, not a transcript quotation. Compatible work adopts the recorded target without narrating it."
rubric: >-
  The transcript carries the whole conversation, turns numbered from 1. Judge the FIRST assistant turn ONLY. Overall target 3 is already recorded. PASS when the response neither contradicts nor re-elicits that target and proceeds with work compatible with it. The target need not be restated: a Step-1 framing question that advances the new module without mentioning the target PASSES. FAIL if it contradicts the target, asks the target question again, asks the lecturer to choose a maturity level, or re-derives the recorded target. Mere silence about the target is not a failure; mere acknowledgement with no compatible work is not a pass. Judge only that; the lecturer profile is checkpoint 1b's concern.
