id: gold.opening.1m.product-process-decision
label: clear-pass
expected: pass
note: "Synthetic reconstruction of the audited product/process/evidence framing, not a verbatim transcript. It advances the supplied outcome's assessment decision while leaving authorship with the lecturer; no finished blueprint is required."
rubric: >-
  The transcript carries the whole conversation, turns numbered from 1. Judge the FIRST assistant turn ONLY. The lecturer explicitly names assessment as the work and supplies one outcome; the design-versus-transfer label changes nothing about the immediate action. PASS requires substantive assessment work in this turn. A bounded, outcome-specific assessment decision frame that advances Step 3 counts: for the outcome of evaluating two renovation variants, distinguish product evidence (the justified comparison), process evidence (how the judgement was reached), and their formative or summative use, then ask the lecturer to decide. This PASSES without a drafted blueprint, criteria list or finished evidence specification: the lecturer authors the module. Merely naming assessment or asking an empty/generic question such as 'What assessment do you want?' is FAIL, not substantive work. FAIL if the response first asks which category applies, replaces the request with a generic ambition interview, refuses to work the named entry, or redirects to framing or outcomes as a prerequisite.
user: "Ob das nun neues Design oder Transfer heisst, ist mir egal. Die Lernziele stehen: Studierende bewerten zwei Sanierungsvarianten. Arbeiten wir jetzt am Assessment dafür."
answer: "Wir steigen direkt in Schritt 3 ein. Für das Bewerten zweier Sanierungsvarianten unterscheiden wir das Produkt — einen begründeten Variantenvergleich — vom Prozessnachweis, der zeigt, wie die Studierenden Kriterien abgewogen haben. Ein Zwischenvergleich kann formatives Feedback tragen, die abschliessende begründete Empfehlung die summative Bewertung. Welcher Nachweis soll bei Ihnen die Bewertungsentscheidung tragen?"

