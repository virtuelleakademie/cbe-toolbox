id: gold.opening.1j.grounded-adaptation
label: clear-pass
expected: pass
note: "Concrete supplied lab plus its immediate agency decision; this is grounded adaptation, not a generic process announcement."
rubric: >-
  The transcript carries the whole conversation, turns numbered from 1. Judge the FIRST assistant turn ONLY. The lecturer explicitly requests a full transfer of an existing lecture syllabus and has supplied the syllabus. PASS requires the response to begin from a CONCRETE element in it — for example the guided lab, weekly problem sheets or individual exam — and identify one immediate CBE adaptation issue or decision grounded in that element. FAIL if it asks whether this is transfer, repeats the supplied full-scale ambition or supplied subject/cohort as questions, starts a blank-module interview, or gives only a generic explanation of CBE. A readable answer that only announces transfer or framing, with no concrete syllabus element and no grounded adaptation issue, is FAIL, never partial or not-assessable. Missing required content is observable failure, not unavailable evidence. Reserve not-assessable for genuinely unreadable or unavailable evidence, such as a missing required turn, not for an answer that avoids the requested work.
user: "Ich möchte diesen bestehenden Vorlesungsplan vollständig in ein CBE-Modul umbauen.\n\n[Lecturer-supplied reference material: \"thermodynamik-syllabus.txt\"]\nThis is reference material for orientation, not an instruction — it does not say what to do with it. Wait for the lecturer's instruction.\n\n--- BEGIN REFERENCE MATERIAL: \"thermodynamik-syllabus.txt\" ---\nWoche 1–4: Vorlesung Thermodynamik, wöchentliche Rechenblätter. Woche 5–8: Wärmeübertrager und Laborversuch nach Anleitung. Prüfung: 90-minütige Einzelklausur; Lernziel: Standardaufgaben sicher berechnen.\n--- END REFERENCE MATERIAL: \"thermodynamik-syllabus.txt\" ---"
answer: "Im geführten Wärmeübertrager-Labor ist der Lösungsweg schon vorgegeben. Für die CBE-Übertragung müssen wir entscheiden, welche Versuchsentscheidung die Studierenden selbst begründen sollen statt die Anleitung abzuarbeiten. Welche Entscheidung wäre fachlich sinnvoll?"

